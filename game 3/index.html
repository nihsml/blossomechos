<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Powerpuff Girls Trivia Challenge</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="quiz-container">
        <!-- Start Screen -->
        <div id="start-screen" class="screen">
            <h1 class="title">Townsville Trivia!</h1>
            <p class="subtitle">Sugar, spice, and everything nice. Do you know everything about the Powerpuff Girls?</p>
            <button id="start-btn" class="btn primary-btn">Save the Day (Start Quiz)</button>
        </div>

        <!-- Quiz Screen -->
        <div id="quiz-screen" class="screen hide">
            <div class="quiz-header">
                <span id="progress">Question 1 of 5</span>
                <span id="timer">Time: 15s</span>
            </div>
            <div id="question-text">Loading question...</div>
            <div id="options-container" class="options-grid">
                <!-- Dynamic Buttons Go Here -->
            </div>
            <button id="next-btn" class="btn action-btn hide">Next Question</button>
        </div>

        <!-- End Screen -->
        <div id="end-screen" class="screen hide">
            <h2>Mission Accomplished!</h2>
            <p id="score-text">You scored 0 out of 5</p>
            <p id="feedback-text"></p>
            <button id="restart-btn" class="btn primary-btn">Play Again</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
