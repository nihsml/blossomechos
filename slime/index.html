
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Squishy Slime Game</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>🟣 Squishy Slime</h1>
    <p>Squish it, stretch it, pop it!</p>
  </header>

  <div class="stats">
    <div class="stat">💖 Squishes: <b id="score">0</b></div>
    <div class="stat">✨ Combo: <b id="combo">0</b></div>
  </div>

  <div class="arena" id="arena">
    <div class="slime" id="slime">
      <div class="face" id="face">◕‿◕</div>
    </div>
  </div>

  <div class="controls">
    <button id="colorBtn">🎨 Change Color</button>
    <button id="popBtn">💥 Pop!</button>
    <button id="resetBtn">🔄 Reset</button>
  </div>

  <div class="controls">
    <button data-mode="soft">☁️ Soft</button>
    <button data-mode="jelly">🍮 Jelly</button>
    <button data-mode="rainbow">🌈 Rainbow</button>
  </div>

  <p class="hint">
    👆 Touch and drag the slime to stretch it.<br>
    Tap repeatedly to earn squish points!
  </p>

  <script src="script.js"></script>
</body>
</html>
