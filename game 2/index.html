<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>248 Puzzle Game</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="game">
    <h1>248 Game</h1>
    <p>Merge matching tiles to reach 248!</p>

    <div class="top">
      <p>Score: <span id="score">0</span></p>
      <button onclick="restart()">Restart</button>
    </div>

    <div id="board" class="board"></div>
    <p id="message">Use arrow keys or swipe to play.</p>
  </main>

  <script src="script.js"></script>
</body>
</html>
